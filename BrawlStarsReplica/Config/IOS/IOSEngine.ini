[SystemSettings]
; iOS Device Profiles for Anime Cyberpunk Brawl Stars

; Graphics Settings for Different iOS Devices
r.MobileContentScaleFactor=1.0
r.MobileTonemapperFilm=1
r.Mobile.SceneDepthAux=0

; iPhone/iPad Performance Tiers
[iPhone13 DeviceProfile]
DeviceType=IOS
BaseProfileName=IOS
+CVars=r.MobileContentScaleFactor=2.0
+CVars=r.MobileHDR=1
+CVars=r.MobileNumDynamicPointLights=4
+CVars=r.BloomQuality=3
+CVars=r.LightShaftQuality=1

[iPadPro DeviceProfile]
DeviceType=IOS
BaseProfileName=IOS
+CVars=r.MobileContentScaleFactor=2.0
+CVars=r.MobileHDR=1
+CVars=r.MobileNumDynamicPointLights=6
+CVars=r.BloomQuality=4
+CVars=r.LightShaftQuality=2

[iPhoneSE DeviceProfile]
DeviceType=IOS
BaseProfileName=IOS
+CVars=r.MobileContentScaleFactor=1.5
+CVars=r.MobileHDR=0
+CVars=r.MobileNumDynamicPointLights=2
+CVars=r.BloomQuality=2
+CVars=r.LightShaftQuality=0

; Cyberpunk Visual Effects
[CyberpunkPostProcess]
r.PostProcessAAQuality=3
r.MotionBlurQuality=2
r.DefaultFeature.Bloom=1
r.EyeAdaptationQuality=2
r.SceneColorFringeQuality=1
r.Tonemapper.Sharpen=0.5

; Battery and Performance Optimization
[PowerManagement]
r.Mobile.ShadingPath=0
r.Mobile.UseHWsRGBEncoding=1
r.Mobile.DisableVertexFog=1
r.VSync=0

; Network Settings for Mobile
[NetworkSettings]
net.UseAdaptiveNetUpdateFrequency=1
net.MinNetUpdateFrequency=20
net.MaxNetUpdateFrequency=60