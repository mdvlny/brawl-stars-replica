+CVars=r.Mobile.Forward.EnableLocalLights=1
+CVars=r.Mobile.Forward.EnableClusteredReflections=0
+CVars=r.PostProcessAAQuality=2
+CVars=r.BloomQuality=3
+CVars=r.MotionBlurQuality=2

