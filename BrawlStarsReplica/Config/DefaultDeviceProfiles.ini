[DeviceProfiles]

; Base iOS profile for anime cyberpunk optimization
[IOS DeviceProfile]
DeviceType=IOS
BaseProfileName=
+CVars=r.MobileHDR=1
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileTonemapperFilm=1
+CVars=r.Mobile.UseHWsRGBEncoding=1
